[mpu6050]
# This file is loaded only when --config mpu6050.cfg is supplied.
# Explicit command-line options override these values.

output = movement_01.bin
no_log = false
no_plot = false

bus = 1
address = 0x68

# Most-sensitive full-scale ranges.
accel_range = 2
gyro_range = 250

# Accelerometer DLPF bandwidth: 44, 94, 184, or 260 Hz.
bandwidth = 260

# Display settings.
window = 5
plot_hz = 20
scale_hz = 3
spectrogram = off
spectrogram_hz = 2
