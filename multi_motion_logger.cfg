[logger]
sample_rate_hz = 1000
window_seconds = 5
plot_hz = 20
scale_hz = 3
spectrogram_hz = 2
fft_samples = 256
fft_overlap_percent = 75
log_enabled = true
# false: warn and skip an unavailable enabled sensor; true: stop at first failure
require_all_sensors = false
output_directory = recordings
section_a_source = mpu_accel
section_a_view = time
section_b_source = mpu_gyro
section_b_view = time

[mpu6050]
enabled = true
bus = 1
address = 0x68
accel_range = 2
gyro_range = 250

[lsm6dso]
enabled = true
bus = 2
address = 0x6B
accel_range = 2
gyro_range = 250

[adxl355]
enabled = true
spi_bus = 0
spi_device = 0
spi_speed_hz = 5000000
accel_range = 2

[scl3300]
enabled = true
spi_bus = 1
spi_device = 0
spi_speed_hz = 2000000
# Mode 1: +/-1.2 g, 40 Hz. Mode 2: +/-2.4 g, 70 Hz.
# Modes 3/4: precision inclination, 10 Hz.
mode = 1
