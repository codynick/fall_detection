[logger]
sample_rate_hz = 1000
window_seconds = 10
# Number of independent display rows: 2, 3, or 4
display_rows = 4
plot_hz = 20
scale_hz = 3
spectrogram_hz = 2
fft_samples = 256
fft_overlap_percent = 75
power_enabled = true
# Analysis window covers this many overlapping spectrogram frames.
power_frames = 5
power_remove_dc = true
power_floor_db = -160
snr_enabled = true
# Press N while quiet to measure noise for all detected sources.
snr_calibration_seconds = 5
snr_calibration_max_spread_db = 6
# Practical displayed SNR is clamped to at least 0 dB.
snr_floor_db = 0
# In --no-plot mode, print live measurements and metrics at this rate.
terminal_metrics_enabled = true
terminal_hz = 1
log_enabled = true
# displayed: log only sources selected in non-None rows; all: log every source
log_scope = displayed
# false: warn and skip an unavailable enabled sensor; true: stop at first failure
require_all_sensors = false
output_directory = recordings
section_a_source = mpu_accel
section_a_view = time
section_b_source = mpu_gyro
section_b_view = time
section_c_source = adxl355_accel
section_c_view = time
section_d_source = scl3300_accel
section_d_view = time

[mpu6050]
enabled = true
bus = 1
address = 0x68
accel_range = 2
gyro_range = 250

[lsm6dso]
enabled = true
bus = 2
address = 0x6B
accel_range = 2
gyro_range = 250

[adxl355]
enabled = true
spi_bus = 0
spi_device = 0
spi_speed_hz = 5000000
accel_range = 2

[scl3300]
enabled = true
spi_bus = 1
spi_device = 0
spi_speed_hz = 2000000
# Mode 1: +/-1.2 g, 40 Hz. Mode 2: +/-2.4 g, 70 Hz.
# Modes 3/4: precision inclination, 10 Hz.
mode = 1
